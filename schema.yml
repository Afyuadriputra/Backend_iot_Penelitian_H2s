components:
  schemas:
    ARKLResult:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        worker:
          type: integer
          readOnly: true
        worker_code:
          type: string
          readOnly: true
        reading:
          type: integer
          readOnly: true
          nullable: true
        device_code:
          type: string
          nullable: true
          readOnly: true
        calculation_type:
          allOf:
          - $ref: '#/components/schemas/CalculationTypeEnum'
          readOnly: true
        concentration_ppm:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,6})?$
          readOnly: true
        concentration_mg_m3:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,6})?$
          readOnly: true
        exposure_concentration_mg_m3:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,6})?$
          readOnly: true
          nullable: true
        body_weight:
          type: string
          format: decimal
          pattern: ^-?\d{0,6}(?:\.\d{0,4})?$
          readOnly: true
        exposure_time:
          type: string
          format: decimal
          pattern: ^-?\d{0,6}(?:\.\d{0,4})?$
          readOnly: true
        exposure_frequency:
          type: string
          format: decimal
          pattern: ^-?\d{0,6}(?:\.\d{0,4})?$
          readOnly: true
        exposure_duration:
          type: string
          format: decimal
          pattern: ^-?\d{0,6}(?:\.\d{0,4})?$
          readOnly: true
        inhalation_rate:
          type: string
          format: decimal
          pattern: ^-?\d{0,6}(?:\.\d{0,4})?$
          readOnly: true
        averaging_time:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,4})?$
          readOnly: true
          nullable: true
        intake:
          type: string
          format: decimal
          pattern: ^-?\d{0,12}(?:\.\d{0,12})?$
          readOnly: true
          nullable: true
        rfc:
          type: string
          format: decimal
          pattern: ^-?\d{0,6}(?:\.\d{0,8})?$
          readOnly: true
        rq:
          type: string
          format: decimal
          pattern: ^-?\d{0,12}(?:\.\d{0,12})?$
          readOnly: true
        interpretation:
          type: string
          readOnly: true
        calculation_version:
          type: string
          readOnly: true
        source_simulated:
          type: boolean
          readOnly: true
        period_start:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        period_end:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        reading_count:
          type: integer
          readOnly: true
          nullable: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - averaging_time
      - body_weight
      - calculation_type
      - calculation_version
      - concentration_mg_m3
      - concentration_ppm
      - created_at
      - device_code
      - exposure_concentration_mg_m3
      - exposure_duration
      - exposure_frequency
      - exposure_time
      - id
      - inhalation_rate
      - intake
      - interpretation
      - period_end
      - period_start
      - reading
      - reading_count
      - rfc
      - rq
      - source_simulated
      - worker
      - worker_code
    Alert:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        worker_code:
          type: string
          readOnly: true
        device_code:
          type: string
          readOnly: true
        reading_id:
          type: integer
          readOnly: true
        arkl_result_id:
          type: integer
          readOnly: true
        concentration_ppm:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,6})?$
          readOnly: true
        environmental_level:
          type: integer
          readOnly: true
        environmental_status:
          type: string
          readOnly: true
        environmental_severity:
          allOf:
          - $ref: '#/components/schemas/EnvironmentalSeverityEnum'
          readOnly: true
        rq:
          type: string
          format: decimal
          pattern: ^-?\d{0,12}(?:\.\d{0,12})?$
          readOnly: true
        risk_interpretation:
          type: string
          readOnly: true
        calculation_version:
          type: string
          readOnly: true
        alert_level:
          allOf:
          - $ref: '#/components/schemas/AlertLevelEnum'
          readOnly: true
        risk_status:
          allOf:
          - $ref: '#/components/schemas/RiskStatusEnum'
          readOnly: true
        status:
          allOf:
          - $ref: '#/components/schemas/StatusEnum'
          readOnly: true
        recommendation_codes:
          readOnly: true
        alert_rule_version:
          type: string
          readOnly: true
        source_simulated:
          type: boolean
          readOnly: true
        acknowledged_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        resolved_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - acknowledged_at
      - alert_level
      - alert_rule_version
      - arkl_result_id
      - calculation_version
      - concentration_ppm
      - created_at
      - device_code
      - environmental_level
      - environmental_severity
      - environmental_status
      - id
      - reading_id
      - recommendation_codes
      - resolved_at
      - risk_interpretation
      - risk_status
      - rq
      - source_simulated
      - status
      - updated_at
      - worker_code
    AlertEvaluateRequest:
      type: object
      properties:
        arkl_result_id:
          type: integer
      required:
      - arkl_result_id
    AlertEvaluationResponse:
      type: object
      properties:
        created:
          type: boolean
        duplicate:
          type: boolean
        escalated:
          type: boolean
        alert:
          allOf:
          - $ref: '#/components/schemas/Alert'
          nullable: true
      required:
      - alert
      - created
      - duplicate
      - escalated
    AlertLevelEnum:
      enum:
      - NONE
      - LOW
      - MEDIUM
      - HIGH
      - CRITICAL
      type: string
      description: |-
        * `NONE` - NONE
        * `LOW` - LOW
        * `MEDIUM` - MEDIUM
        * `HIGH` - HIGH
        * `CRITICAL` - CRITICAL
    CalculationTypeEnum:
      enum:
      - REALTIME
      - HISTORICAL
      type: string
      description: |-
        * `REALTIME` - Realtime
        * `HISTORICAL` - Historical
    Device:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        device_code:
          type: string
          maxLength: 100
        name:
          type: string
          maxLength: 150
        location:
          type: string
          maxLength: 255
        is_active:
          type: boolean
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - device_code
      - id
      - updated_at
    EnvironmentalSeverityEnum:
      enum:
      - NORMAL
      - CAUTION
      - WARNING
      - DANGER
      - CRITICAL
      type: string
      description: |-
        * `NORMAL` - NORMAL
        * `CAUTION` - CAUTION
        * `WARNING` - WARNING
        * `DANGER` - DANGER
        * `CRITICAL` - CRITICAL
    ExposureProfile:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        worker:
          type: integer
        worker_code:
          type: string
          readOnly: true
        body_weight:
          type: number
          format: double
          minimum: 0.01
          description: Berat badan dalam kilogram.
        exposure_time:
          type: number
          format: double
          minimum: 0
          description: Waktu pajanan. Satuan final mengikuti metode ARKL.
        exposure_frequency:
          type: number
          format: double
          minimum: 0
          description: Frekuensi pajanan. Satuan final mengikuti metode ARKL.
        exposure_duration:
          type: number
          format: double
          minimum: 0
          description: Durasi pajanan. Satuan final mengikuti metode ARKL.
        inhalation_rate:
          type: number
          format: double
          minimum: 0
          description: Laju inhalasi. Satuan final mengikuti metode ARKL.
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - body_weight
      - created_at
      - exposure_duration
      - exposure_frequency
      - exposure_time
      - id
      - inhalation_rate
      - updated_at
      - worker
      - worker_code
    H2SReading:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        device:
          type: integer
          readOnly: true
        device_code:
          type: string
          readOnly: true
        ppm:
          type: number
          format: double
          readOnly: true
        adc:
          type: integer
          readOnly: true
        filtered_adc:
